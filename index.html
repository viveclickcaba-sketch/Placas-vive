<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placas VIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--panel:#161616;--line:#2a2a2a;--ink:#f4f4f4;--mute:#a3a3a3;--red:#ff0000}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif;overflow-x:clip}
header{display:flex;align-items:center;gap:12px;padding:16px max(4vw,16px) 0;flex-wrap:wrap}
header b{color:var(--red);font-weight:800;font-size:26px;letter-spacing:-.5px}
header span{color:var(--mute);font-size:15px}
nav{display:flex;gap:6px;padding:14px max(4vw,16px) 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{background:none;color:var(--mute);border:0;border-bottom:3px solid transparent;border-radius:0;min-height:48px;padding:0 16px;font:700 16px Poppins,sans-serif;cursor:pointer;flex:none}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--red)}
section[hidden]{display:none}
.wrap{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(20px,4vw,44px);padding:clamp(18px,3vw,32px) max(4vw,16px);max-width:1100px;margin:0 auto;align-items:start}
.stage{position:sticky;top:16px}
canvas.prev{width:100%;display:block;border-radius:14px;touch-action:none;cursor:grab;box-shadow:0 20px 50px rgba(0,0,0,.5);background:repeating-conic-gradient(#3a3a3a 0 25%,#262626 0 50%) 0 0/28px 28px}
.r916{aspect-ratio:9/16}.r45{aspect-ratio:4/5}
.hint{color:var(--mute);font-size:13px;margin:10px 2px 0;text-align:center}
.form{display:grid;gap:16px}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
label small{font-weight:500;color:var(--mute);font-size:13px}
textarea,input[type=text]{font:500 16px/1.4 Poppins,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical;width:100%}
.up{text-transform:uppercase}
textarea:focus,input:focus,button:focus-visible,.file:focus-within{outline:2px solid var(--red);outline-offset:2px}
.file{display:flex;align-items:center;justify-content:center;min-height:52px;border:2px dashed #3a3a3a;border-radius:12px;background:var(--panel);font-weight:700;cursor:pointer;text-align:center;padding:10px;position:relative}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
input[type=range]{accent-color:var(--red);height:44px;width:100%}
button,.btn{font:700 16px Poppins,sans-serif;border:0;border-radius:12px;min-height:48px;padding:0 18px;cursor:pointer;color:var(--ink);text-decoration:none;display:inline-grid;place-items:center}
.primary{background:var(--red);color:#fff;font-size:18px;min-height:58px;width:100%}
.ghost{background:var(--panel);border:1px solid var(--line)}
.white{background:#fff;color:#000}
.msg{min-height:20px;font-size:14px;color:var(--mute);margin:0}
.fallback{display:none;gap:8px}.fallback img{width:100%;max-width:280px;border-radius:10px}
.box{display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.box h2{margin:0;font-size:18px}
.copyTxt{background:#0f0f0f;min-height:180px;white-space:pre-wrap}
.guiaBtn{background:var(--panel);border:2px solid var(--red);width:100%;min-height:56px;font-size:17px}
#guiaBox{display:none;gap:10px}#guiaBox img{width:100%;border-radius:12px;display:block}
/* carrusel */
.car{padding:clamp(18px,3vw,32px) max(4vw,16px);max-width:1100px;margin:0 auto;display:grid;gap:20px}
.slide{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;align-items:start}
.slide h3{margin:0;font-size:17px;display:flex;align-items:center;gap:10px}
.slide h3 i{font-style:normal;background:var(--red);color:#fff;border-radius:50%;width:32px;height:32px;display:inline-grid;place-items:center;font-size:15px}
.slide .form{gap:12px}
.slide textarea,.slide input[type=text]{background:#0f0f0f}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools button{flex:1;min-height:44px;font-size:14px;padding:0 10px}
#slides{display:grid;gap:16px}
.carBar{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{position:static;max-width:340px;margin:0 auto;width:100%}.slide{grid-template-columns:minmax(0,1fr)}.slide canvas{max-width:300px;margin:0 auto}}
</style>
</head>
<body>
<header><b>VIVE</b><span>Generador de placas</span></header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="historia">Historia</button>
  <button role="tab" aria-selected="false" data-tab="carrusel">Carrusel</button>
  <button role="tab" aria-selected="false" data-tab="video">Placa para video</button>
</nav>

<!-- HISTORIA -->
<section id="tab-historia">
  <div class="wrap">
    <div class="stage">
      <canvas id="hC" class="prev r916" width="1080" height="1920" aria-label="Vista previa de la historia"></canvas>
      <p class="hint">Arrastrá la foto para acomodarla</p>
    </div>
    <div class="form">
      <label>Bajada <small>En rojo, arriba del título</small>
        <input type="text" id="hBaj" class="up" value="Diputados · Presupuesto 2027" maxlength="80"></label>
      <label>Título <small>En blanco. Podés sumar emojis. Con Enter cortás la línea</small>
        <textarea id="hTit" class="up" rows="3" maxlength="160">Media sanción para Milei, pero con fondos universitarios 🎓</textarea></label>
      <label>Dato extra para el copy <small>Opcional</small>
        <textarea id="hExtra" rows="2" maxlength="400"></textarea></label>
      <label class="file"><input type="file" id="hFoto" accept="image/*"><span id="hFotoTxt">Subir foto</span></label>
      <label>Zoom de la foto
        <div class="row"><input type="range" id="hZoom" min="1" max="3" step="0.01" value="1"><button type="button" class="ghost" id="hReset" style="flex:none">Centrar</button></div></label>
      <button type="button" class="primary" id="hBajar">Descargar PNG</button>
      <p class="msg" id="hMsg"></p>
      <div class="fallback" id="hFb"><p class="hint" style="text-align:left;margin:0">Mantené apretada la imagen y elegí “Guardar imagen”.</p><img alt="Historia lista"></div>
      <div class="box" data-copy="h"></div>
    </div>
  </div>
</section>

<!-- CARRUSEL -->
<section id="tab-carrusel" hidden>
  <div class="car">
    <div id="slides"></div>
    <div class="carBar">
      <button type="button" class="ghost" id="addSlide">+ Agregar slide</button>
      <button type="button" class="primary" id="bajarTodas" style="min-height:48px;font-size:16px">Descargar todas</button>
      <button type="button" class="white" id="compartirTodas" hidden>Compartir / guardar todas</button>
    </div>
    <p class="msg" id="cMsg"></p>
    <div class="box" data-copy="c"></div>
  </div>
</section>

<!-- PLACA PARA VIDEO -->
<section id="tab-video" hidden>
  <div class="wrap">
    <div class="stage">
      <canvas id="vC" class="prev r916" width="1080" height="1920" aria-label="Vista previa de la placa para video"></canvas>
      <p class="hint">Sin foto, el fondo sale transparente para usar sobre video</p>
    </div>
    <div class="form">
      <label>Bajada <small>En rojo, arriba del título</small>
        <input type="text" id="vBaj" class="up" value="Hinchas de Boca en Colombia" maxlength="80"></label>
      <label>Título <small>En blanco. Con Enter cortás la línea</small>
        <textarea id="vTit" class="up" rows="3" maxlength="140">Abrieron un telón en el avión de Boca</textarea></label>
      <label>Dato extra para el copy <small>Opcional</small>
        <textarea id="vExtra" rows="2" maxlength="400"></textarea></label>
      <label class="file"><input type="file" id="vFoto" accept="image/*"><span id="vFotoTxt">Subir foto (opcional)</span></label>
      <div class="row"><input type="range" id="vZoom" min="1" max="3" step="0.01" value="1" aria-label="Zoom"><button type="button" class="ghost" id="vQuitar" style="flex:none">Quitar foto</button></div>
      <button type="button" class="primary" id="vBajar">Descargar PNG</button>
      <p class="msg" id="vMsg"></p>
      <div class="fallback" id="vFb"><p class="hint" style="text-align:left;margin:0">Mantené apretada la imagen y elegí “Guardar imagen”.</p><img alt="Placa lista"></div>
      <div class="box" data-copy="v"></div>
      <button type="button" class="guiaBtn" id="verGuia">¿Cómo la subo arriba de un video?</button>
      <div id="guiaBox">

/* ---------- utilidades ---------- */
function cover(ctx,p,W,H){
  const i=p.img,s=Math.max(W/i.width,H/i.height)*p.zoom,w=i.width*s,h=i.height*s;
  const mx=(w-W)/2,my=(h-H)/2;
  p.ox=Math.max(-mx,Math.min(mx,p.ox));p.oy=Math.max(-my,Math.min(my,p.oy));
  ctx.drawImage(i,(W-w)/2+p.ox,(H-h)/2+p.oy,w,h);
}
function blurCover(ctx,p,W,H){
  const a=document.createElement('canvas');a.width=Math.round(W/14);a.height=Math.round(H/14);
  const ac=a.getContext('2d');ac.scale(1/14,1/14);cover(ac,p,W,H);
  const b=document.createElement('canvas');b.width=Math.round(W/4);b.height=Math.round(H/4);
  const bc=b.getContext('2d');bc.imageSmoothingQuality='high';bc.drawImage(a,0,0,b.width,b.height);
  ctx.save();ctx.imageSmoothingQuality='high';ctx.drawImage(b,-20,-20,W+40,H+40);ctx.restore();
}
function grad(ctx,y0,y1,W,stops){
  const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach(([o,a])=>g.addColorStop(o,`rgba(0,0,0,${a})`));
  ctx.fillStyle=g;ctx.fillRect(0,y0,W,y1-y0);
}
function logo(ctx,cx,top,w){if(LOGO.naturalWidth){const h=w*LOGO.naturalHeight/LOGO.naturalWidth;ctx.drawImage(LOGO,cx-w/2,top,w,h)}}
/* words: [{t,c}] -> lines of words */
function wrapW(ctx,words,maxW){
  const lines=[];let line=[],wid=0;const sp=ctx.measureText(' ').width;
  for(const w of words){
    if(w.br){if(line.length)lines.push(line);line=[];wid=0;continue}
    const ww=ctx.measureText(w.t).width,nw=line.length?wid+sp+ww:ww;
    if(nw>maxW&&line.length){lines.push(line);line=[w];wid=ww}else{line.push(w);wid=nw}
  }
  if(line.length)lines.push(line);return lines;
}
function toWords(text,c){const out=[];text.split('\n').forEach((par,k)=>{if(k)out.push({br:1});par.trim().split(/\s+/).filter(Boolean).forEach(t=>out.push({t,c}))});return out}
function drawLine(ctx,line,x,y){const sp=ctx.measureText(' ').width;let cx=x;for(const w of line){ctx.fillStyle=w.c;ctx.fillText(w.t,cx,y);cx+=ctx.measureText(w.t).width+sp}}
function fit(ctx,words,maxW,fontFn,start,min,maxLines){
  let s=start,l;do{ctx.font=fontFn(s);l=wrapW(ctx,words,maxW);if(l.length<=maxLines)break;s-=2}while(s>min);ctx.font=fontFn(s);return {s,l};
}
function shadow(ctx,on){ctx.shadowColor=on?'rgba(0,0,0,.45)':'transparent';ctx.shadowBlur=on?14:0;ctx.shadowOffsetY=on?2:0}
const U=s=>s.toLocaleUpperCase('es');

function newPhoto(){return {img:null,zoom:1,ox:0,oy:0}}
function loadInto(file,p,cb){
  if(!file||!file.type.startsWith('image/'))return;
  const im=new Image();im.onload=()=>{p.img=im;p.zoom=1;p.ox=p.oy=0;cb()};im.src=URL.createObjectURL(file);
}
function dragOn(canvas,getP,redraw){
  let d=null;
  canvas.addEventListener('pointerdown',e=>{const p=getP();if(!p||!p.img)return;d={x:e.clientX,y:e.clientY,ox:p.ox,oy:p.oy,p};canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener('pointermove',e=>{if(!d)return;const k=canvas.width/canvas.clientWidth;d.p.ox=d.ox+(e.clientX-d.x)*k;d.p.oy=d.oy+(e.clientY-d.y)*k;redraw()});
  const end=()=>d=null;canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
}
function slug(t){return t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'placa'}
function toBlob(c){return new Promise(r=>c.toBlob(r,'image/png'))}
async function bajar(canvas,name,msgEl,fbEl){
  const blob=await toBlob(canvas);if(!blob){if(msgEl)msgEl.textContent='No se pudo generar la imagen.';return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  if(msgEl)msgEl.textContent='Listo, PNG descargado. Si no se bajó, guardalo desde la imagen de abajo.';
  if(fbEl){fbEl.querySelector('img').src=a.href;fbEl.style.display='grid'}
}

/* ---------- copy ---------- */
const cierres=['¿Qué te parece? Te leemos 👇','¿Vos qué opinás? 👇','Etiquetá a alguien que tiene que ver esto 👀','¿Lo sabías? Contanos en los comentarios 👇','Mandáselo a quien tiene que enterarse 📲'];
let ci=0;
function oracion(t){t=t.trim();if(!t)return '';t=t.charAt(0).toUpperCase()+t.slice(1);return /[.!?…]$/.test(t)?t:t+'.'}
function mountCopy(box,get){
  box.innerHTML='<h2>Copy para Instagram</h2><div class="row"><button type="button" class="ghost">Generar copy</button><button type="button" class="white">Copiar</button></div><textarea class="copyTxt" rows="8" placeholder="Tocá “Generar copy” y aparece acá. Lo podés retocar antes de copiarlo."></textarea>';
  const [gen,cop]=box.querySelectorAll('button'),ta=box.querySelector('textarea');
  gen.addEventListener('click',()=>{
    const f=get();const partes=['🔴 '+U(f.tit.replace(/\s*\n\s*/g,' ').trim())];
    const cuerpo=[oracion(f.baj),f.extra.trim()].filter(Boolean).join(' ');if(cuerpo)partes.push(cuerpo);
    partes.push(cierres[ci++%cierres.length]);partes.push('#VIVE #CABA #BuenosAires');ta.value=partes.join('\n\n');
  });
  cop.addEventListener('click',async()=>{if(!ta.value)gen.click();
    try{await navigator.clipboard.writeText(ta.value)}catch(e){ta.focus();ta.select();try{document.execCommand('copy')}catch(_){}}
    cop.textContent='¡Copiado!';setTimeout(()=>cop.textContent='Copiar',1800)});
}

document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
  ['historia','carrusel','video'].forEach(t=>$('tab-'+t).hidden=t!==b.dataset.tab);
  try{localStorage.setItem('vive-tab',b.dataset.tab)}catch(e){}
}));

const hP=newPhoto(),hC=$('hC'),hx=hC.getContext('2d');
function drawH(){
  const W=1080,H=1920,X=142,MW=830;
  hx.clearRect(0,0,W,H);
  if(hP.img)cover(hx,hP,W,H);else{const g=hx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3a3a3a');g.addColorStop(1,'#1a1a1a');hx.fillStyle=g;hx.fillRect(0,0,W,H)}
  const t=fit(hx,toWords(U($('hTit').value),'#fff'),MW,s=>`800 ${s}px Montserrat`,74,52,5);
  const lh=t.s*1.05,last=1690,first=last-(t.l.length-1)*lh;
  hx.font='700 42px Montserrat';const bl=wrapW(hx,toWords(U($('hBaj').value),RED),MW).slice(0,2);
  const bLast=first-t.s*0.78-30,bFirst=bLast-(bl.length-1)*50;
  const top=bl.length?bFirst-44:first-t.s;
  grad(hx,Math.min(1050,top-380),H,W,[[0,0],[.45,.55],[.8,.85],[1,.92]]);
  hx.textBaseline='alphabetic';hx.textAlign='left';shadow(hx,1);
  hx.font='700 42px Montserrat';bl.forEach((l,k)=>drawLine(hx,l,X,bFirst+k*50));
  hx.font=`800 ${t.s}px Montserrat`;t.l.forEach((l,k)=>drawLine(hx,l,X,first+k*lh));
  shadow(hx,0);logo(hx,540,190,172);
}
['hBaj','hTit'].forEach(id=>$(id).addEventListener('input',drawH));
$('hFoto').addEventListener('change',e=>loadInto(e.target.files[0],hP,()=>{$('hZoom').value=1;$('hFotoTxt').textContent='Cambiar foto';drawH()}));
$('hZoom').addEventListener('input',e=>{hP.zoom=+e.target.value;drawH()});
$('hReset').addEventListener('click',()=>{hP.zoom=1;hP.ox=hP.oy=0;$('hZoom').value=1;drawH()});
dragOn(hC,()=>hP,drawH);
$('hBajar').addEventListener('click',()=>{drawH();bajar(hC,'vive-historia-'+slug($('hTit').value)+'.png',$('hMsg'),$('hFb'))});
mountCopy(document.querySelector('[data-copy=h]'),()=>({tit:$('hTit').value,baj:$('hBaj').value,extra:$('hExtra').value}));

/* ---------- CARRUSEL ---------- */
const CW=1080,CH=1350,CX=88,CMW=904;
const slides=[
  {tipo:'portada',baj:'Ley Malvinas',tit:'¿Qué leyes se frenaron ayer en Diputados?',p:newPhoto()},
  {tipo:'interna',rojo:'¿Qué pasó',blanco:'exactamente en el recinto?',txt:'Para que una sesión en Diputados pueda empezar, se necesitan al menos 129 diputados sentados en sus bancas.\n\nA las 12:31, cuando venció el tiempo de tolerancia, el tablero marcaba 126 presentes.',p:newPhoto()}
];
function drawPortada(ctx,s){
  ctx.clearRect(0,0,CW,CH);
  if(s.p.img)cover(ctx,s.p,CW,CH);else{const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#3a3a3a');g.addColorStop(1,'#141414');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH)}
  const t=fit(ctx,toWords(U(s.tit),'#fff'),CMW,z=>`600 ${z}px Poppins`,92,60,4);
  const lh=t.s*1.08,last=1085,first=last-(t.l.length-1)*lh;
  ctx.font='600 56px Poppins';const bl=wrapW(ctx,toWords(U(s.baj),RED),CMW).slice(0,2);
  const bLast=first-t.s*0.76-26,bFirst=bLast-(bl.length-1)*64;
  const top=bl.length?bFirst-56:first-t.s;
  grad(ctx,Math.min(560,top-260),CH,CW,[[0,0],[.5,.6],[1,.92]]);
  ctx.textBaseline='alphabetic';ctx.textAlign='left';shadow(ctx,1);
  ctx.font='600 56px Poppins';bl.forEach((l,k)=>drawLine(ctx,l,CX,bFirst+k*64));
  ctx.font=`600 ${t.s}px Poppins`;t.l.forEach((l,k)=>drawLine(ctx,l,CX,first+k*lh));
  shadow(ctx,0);logo(ctx,540,1236,156);
}
function drawInterna(ctx,s){
  ctx.clearRect(0,0,CW,CH);
  const p=s.p.img?s.p:(slides[0].p.img?slides[0].p:null);
  if(p){blurCover(ctx,p,CW,CH);ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,CW,CH)}
  else{const g=ctx.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#262626');g.addColorStop(1,'#050505');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH)}
  grad(ctx,700,CH,CW,[[0,0],[1,.85]]);
  const words=toWords(U(s.rojo||''),RED).concat(toWords(U(s.blanco||''),'#fff'));
  const t=fit(ctx,words,CMW,z=>`700 ${z}px Poppins`,74,48,3);
  const lh=t.s*1.06,tFirst=262;
  ctx.textBaseline='alphabetic';ctx.textAlign='left';shadow(ctx,1);
  ctx.font=`700 ${t.s}px Poppins`;t.l.forEach((l,k)=>drawLine(ctx,l,CX,tFirst+k*lh));
  const tLast=tFirst+(t.l.length-1)*lh;
  const pars=U(s.txt||'').split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean);
  let bs=32,blocks,yEnd;const y0=tLast+112;
  do{ctx.font=`500 ${bs}px Poppins`;const lhb=bs*1.25;let y=y0;blocks=pars.map(par=>{const l=wrapW(ctx,toWords(par,'#fff'),CMW);const b={l,y,lhb};y+=l.length*lhb+bs*1.25;return b});yEnd=y-bs*1.25;if(yEnd<=1170)break;bs-=1}while(bs>20);
  ctx.font=`500 ${bs}px Poppins`;blocks.forEach(b=>b.l.forEach((l,k)=>drawLine(ctx,l,CX,b.y+k*b.lhb)));
  shadow(ctx,0);logo(ctx,540,1236,156);
}
function drawSlide(s){const ctx=s.cv.getContext('2d');(s.tipo==='portada'?drawPortada:drawInterna)(ctx,s)}
function drawAll(){slides.forEach(drawSlide)}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderSlides(){
  const box=$('slides');box.innerHTML='';
  slides.forEach((s,i)=>{
    const el=document.createElement('div');el.className='slide';
    const port=s.tipo==='portada';
    el.innerHTML=`<canvas class="prev r45" width="${CW}" height="${CH}" aria-label="Slide ${i+1}"></canvas>
    <div class="form"><h3><i>${i+1}</i>${port?'Portada':'Slide interna'}</h3>
    ${port?`<label>Bajada <small>En rojo</small><input type="text" class="up" data-k="baj" value="${esc(s.baj)}"></label>
    <label>Título <small>En blanco</small><textarea class="up" rows="2" data-k="tit">${esc(s.tit)}</textarea></label>`
    :`<label>Título: parte en rojo <small>Las primeras palabras</small><input type="text" class="up" data-k="rojo" value="${esc(s.rojo)}"></label>
    <label>Título: parte en blanco <small>El resto del título</small><input type="text" class="up" data-k="blanco" value="${esc(s.blanco)}"></label>
    <label>Texto <small>Con Enter separás párrafos</small><textarea class="up" rows="5" data-k="txt">${esc(s.txt)}</textarea></label>`}
    <label class="file"><input type="file" accept="image/*"><span>${s.p.img?'Cambiar foto':(port?'Subir foto':'Subir foto de fondo (si no, usa la de la portada)')}</span></label>
    <div class="tools">${s.p.img?'<button type="button" class="ghost" data-a="quitar">Quitar foto</button>':''}
    ${port?'':`<button type="button" class="ghost" data-a="up" ${i<2?'disabled':''}>Subir ↑</button><button type="button" class="ghost" data-a="down" ${i===slides.length-1?'disabled':''}>Bajar ↓</button><button type="button" class="ghost" data-a="del">Eliminar</button>`}
    <button type="button" class="ghost" data-a="dl">Descargar esta</button></div></div>`;
    box.appendChild(el);s.cv=el.querySelector('canvas');
    el.querySelectorAll('[data-k]').forEach(f=>f.addEventListener('input',()=>{s[f.dataset.k]=f.value;drawSlide(s)}));
    el.querySelector('input[type=file]').addEventListener('change',e=>loadInto(e.target.files[0],s.p,()=>{renderSlides()}));
    el.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>{
      const a=b.dataset.a;
      if(a==='quitar'){s.p=newPhoto();renderSlides()}
      if(a==='del'){slides.splice(i,1);renderSlides()}
      if(a==='up'){[slides[i-1],slides[i]]=[slides[i],slides[i-1]];renderSlides()}
      if(a==='down'){[slides[i+1],slides[i]]=[slides[i],slides[i+1]];renderSlides()}
      if(a==='dl'){drawSlide(s);bajar(s.cv,nombreSlide(i),$('cMsg'))}
    }));
    dragOn(s.cv,()=>s.p.img?s.p:null,()=>{drawSlide(s);if(port)slides.forEach(x=>{if(x.tipo!=='portada'&&!x.p.img)drawSlide(x)})});
  });
  drawAll();
}
function nombreSlide(i){return `vive-carrusel-${String(i+1).padStart(2,'0')}-${slug(slides[0].tit)}.png`}
$('addSlide').addEventListener('click',()=>{slides.push({tipo:'interna',rojo:'',blanco:'',txt:'',p:newPhoto()});renderSlides();const all=document.querySelectorAll('.slide');all[all.length-1].scrollIntoView({behavior:'smooth',block:'start'})});
$('bajarTodas').addEventListener('click',async()=>{
  drawAll();$('cMsg').textContent='Descargando…';
  for(let i=0;i<slides.length;i++){await bajar(slides[i].cv,nombreSlide(i));await new Promise(r=>setTimeout(r,500))}
  $('cMsg').textContent='Listo: se descargaron '+slides.length+' imágenes. Si el navegador pregunta, tocá “Permitir varias descargas”.';
});
try{const f=new File([new Blob(['x'],{type:'image/png'})],'x.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))$('compartirTodas').hidden=false}catch(e){}
$('compartirTodas').addEventListener('click',async()=>{
  drawAll();const files=[];for(let i=0;i<slides.length;i++){const b=await toBlob(slides[i].cv);files.push(new File([b],nombreSlide(i),{type:'image/png'}))}
  try{await navigator.share({files})}catch(e){}
});
mountCopy(document.querySelector('[data-copy=c]'),()=>({tit:slides[0].tit||'',baj:slides[0].baj||'',extra:''}));
renderSlides();

/* ---------- PLACA PARA VIDEO ---------- */
const vP=newPhoto(),vC=$('vC'),vx=vC.getContext('2d');
function drawV(){
  const W=1080,H=1920,X=110,MW=860;
  vx.clearRect(0,0,W,H);if(vP.img)cover(vx,vP,W,H);
  const t=fit(vx,toWords(U($('vTit').value),'#fff'),MW,s=>`700 ${s}px Poppins`,84,56,4);
  const lh=t.s*0.99,last=1548,first=last-(t.l.length-1)*lh;
  vx.font='800 52px Poppins';const bl=wrapW(vx,toWords(U($('vBaj').value),RED),MW).slice(0,2);
  const bLast=first-t.s*0.72-36,bFirst=bLast-(bl.length-1)*58;
  const top=bl.length?bFirst-39:first-t.s*0.75;
  const gS=Math.min(930,top-420),gE=1580;grad(vx,gS,gE,W,[[0,0],[.45,.55],[1,1]]);
  vx.fillStyle='#000';vx.fillRect(0,gE,W,H-gE);
  vx.textBaseline='alphabetic';vx.textAlign='left';
  vx.font='800 52px Poppins';bl.forEach((l,k)=>drawLine(vx,l,X,bFirst+k*58));
  vx.font=`700 ${t.s}px Poppins`;t.l.forEach((l,k)=>drawLine(vx,l,X,first+k*lh));
  logo(vx,540,1616,126);
}
['vBaj','vTit'].forEach(id=>$(id).addEventListener('input',drawV));
$('vFoto').addEventListener('change',e=>loadInto(e.target.files[0],vP,()=>{$('vZoom').value=1;$('vFotoTxt').textContent='Cambiar foto';drawV()}));
$('vZoom').addEventListener('input',e=>{vP.zoom=+e.target.value;drawV()});
$('vQuitar').addEventListener('click',()=>{vP.img=null;$('vFoto').value='';$('vFotoTxt').textContent='Subir foto (opcional)';drawV()});
dragOn(vC,()=>vP,drawV);
$('vBajar').addEventListener('click',()=>{drawV();bajar(vC,'vive-'+slug($('vTit').value)+'.png',$('vMsg'),$('vFb'))});
mountCopy(document.querySelector('[data-copy=v]'),()=>({tit:$('vTit').value,baj:$('vBaj').value,extra:$('vExtra').value}));
$('bajarGuia').href=$('guiaImg').src;
$('verGuia').addEventListener('click',()=>{const b=$('guiaBox'),o=b.style.display==='grid';b.style.display=o?'none':'grid';$('verGuia').textContent=o?'¿Cómo la subo arriba de un video?':'Ocultar los pasos'});

/* ---------- inicio ---------- */
function all(){drawH();drawAll();drawV()}
LOGO.onload=all;all();
if(document.fonts){Promise.all(['800 82px Montserrat','700 44px Montserrat','500 32px Poppins','600 48px Poppins','700 74px Poppins','800 52px Poppins'].map(f=>document.fonts.load(f))).then(all).catch(()=>{});document.fonts.ready.then(all)}
try{const t=localStorage.getItem('vive-tab');if(t){const b=document.querySelector(`nav button[data-tab="${t}"]`);if(b)b.click()}}catch(e){}
}
</script>
