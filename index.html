<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placas VIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--panel:#161616;--line:#2a2a2a;--ink:#f4f4f4;--mute:#a3a3a3;--red:#ff0000}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif;overflow-x:clip}
header{display:flex;align-items:center;gap:12px;padding:18px max(4vw,16px);border-bottom:1px solid var(--line)}
header b{color:var(--red);font-weight:800;font-size:26px;letter-spacing:-.5px}
header span{color:var(--mute);font-size:15px}
main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(20px,4vw,48px);padding:clamp(18px,3vw,36px) max(4vw,16px);max-width:1100px;margin:0 auto;align-items:start}
.stage{position:sticky;top:16px}
canvas#c{width:100%;aspect-ratio:9/16;display:block;border-radius:14px;background:#222;touch-action:none;cursor:grab;box-shadow:0 20px 50px rgba(0,0,0,.5)}
canvas#c.drag{cursor:grabbing}
.hint{color:var(--mute);font-size:13px;margin:10px 2px 0;text-align:center}
form{display:grid;gap:18px}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
label small{font-weight:500;color:var(--mute);font-size:13px}
textarea,input[type=text]{font:500 16px/1.4 Poppins,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical;text-transform:uppercase}
textarea:focus,input:focus,button:focus-visible,.file:focus-within{outline:2px solid var(--red);outline-offset:2px}
.file{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border:2px dashed #3a3a3a;border-radius:12px;background:var(--panel);font-weight:700;cursor:pointer;text-align:center;padding:10px}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input[type=range]{flex:1;accent-color:var(--red);height:44px}
button{font:700 16px Poppins,sans-serif;border:0;border-radius:12px;min-height:48px;padding:0 20px;cursor:pointer}
.primary{background:var(--red);color:#fff;font-size:18px;min-height:58px;width:100%}
.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
#msg{min-height:22px;font-size:14px;color:var(--mute);margin:0}
#fallback{display:none;gap:8px}
#fallback img{width:100%;max-width:300px;border-radius:10px}
@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}.stage{position:static;max-width:360px;margin:0 auto;width:100%}}
</style>
</head>
<body>
<header><b>VIVE</b><span>Generador de historias</span></header>
<main>
  <div class="stage">
    <canvas id="c" width="1080" height="1920" aria-label="Vista previa de la historia"></canvas>
    <p class="hint">Tocá el título o la bajada para editarlos · Arrastrá la foto para acomodarla</p>
  </div>
  <form id="f">
    <label for="bajada">Bajada <small>En rojo, arriba del título</small>
      <input type="text" id="bajada" value="Hinchas de Boca en Colombia" maxlength="80">
    </label>
    <label for="titulo">Título <small>En blanco. Con Enter cortás la línea donde quieras</small>
      <textarea id="titulo" rows="3" maxlength="140">Abrieron un telón en el avión de Boca</textarea>
    </label>
    <label class="file" id="drop">
      <input type="file" id="foto" accept="image/*">
      <span id="fotoTxt">Subir foto</span>
    </label>
    <label>Zoom de la foto
      <div class="row"><input type="range" id="zoom" min="1" max="3" step="0.01" value="1"><button type="button" class="ghost" id="reset">Centrar</button></div>
    </label>
    <button type="submit" class="primary" id="bajar">Descargar PNG</button>
    <p id="msg" role="status"></p>
    <div id="fallback">
      <p class="hint" style="text-align:left;margin:0">Mantené apretada la imagen (o clic derecho) y elegí “Guardar imagen”.</p>
      <img id="out" alt="Historia lista para guardar">
    </div>
  </form>
</main>
